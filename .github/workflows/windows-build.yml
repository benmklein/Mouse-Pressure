name: Windows build

on:
  push:
    branches:
      - main
      - "codex/**"
      - "cleanup/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and release tools
        run: python -m pip install ".[dev,release,sandbox]"

      - name: Run tests
        run: python -m pytest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build application and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1 -Python python -SkipTests

      # Public release jobs can download the separately signed driver artifact
      # and pass -VMultiPayload <directory>. The build rejects unsigned,
      # third-party, or checksum-mismatched payloads before Inno Setup runs.

      - name: Smoke-test installer lifecycle
        shell: pwsh
        run: .\scripts\test_windows_installer.ps1

      - name: Upload standalone application
        uses: actions/upload-artifact@v4
        with:
          name: MousePressure-windows-x64
          path: dist/windows/MousePressure
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MousePressure-installer
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
