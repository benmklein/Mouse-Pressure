[project]
name = "mouse-pressure-driver"
version = "0.1.1"
description = "Turn supported analog mouse buttons into drawing tablet pressure input"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "hidapi==0.15.0",
    "PySide6-Essentials==6.11.1",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.9",
    "ipython>=8.0",
    "pillow>=11.0",
    "pytest>=8.0",
    "ruff>=0.11",
]
release = [
    "pyinstaller==6.22.0",
]
sandbox = [
    "pygame-ce==2.5.8",
]
usb = [
    "pyusb>=1.2",
]
[project.scripts]
mp-sniff = "mouse_pressure.cli:sniff"
mp-bridge = "mouse_pressure.cli:bridge"
mp-visualize = "mouse_pressure.cli:visualize"
mp-pressure = "mouse_pressure.cli:pressure"
mp-pen = "mouse_pressure.bridge.synthetic_pen_cli:main"
mp-dev-ui = "mouse_pressure.dev_ui:main"
mouse-pressure = "mouse_pressure.app:main"
mouse-pressure-sandbox = "mouse_pressure_sandbox.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/mouse_pressure", "src/mouse_pressure_sandbox"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
