[project]
name = "superstrike-pressure"
version = "0.1.0"
description = "Bridge Logitech Superstrike HITS analog mouse buttons to drawing tablet pressure input"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "hidapi>=0.14",
    "PySide6-Essentials>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.9",
    "ipython>=8.0",
    "pillow>=11.0",
    "pytest>=8.0",
]
release = [
    "pyinstaller>=6.22,<7",
]
usb = [
    "pyusb>=1.2",
]
web = [
    "websockets>=13.0",
]

[project.scripts]
ss-sniff = "superstrike_pressure.cli:sniff"
ss-bridge = "superstrike_pressure.cli:bridge"
ss-visualize = "superstrike_pressure.cli:visualize"
ss-pressure = "superstrike_pressure.cli:pressure"
ss-tablet = "superstrike_pressure.cli:tablet"
ss-pen = "superstrike_pressure.bridge.synthetic_pen_cli:main"
ss-dev-ui = "superstrike_pressure.dev_ui:main"
superstrike-pressure = "superstrike_pressure.app:main"
ss-bridge-ws = "superstrike_pressure.web.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
