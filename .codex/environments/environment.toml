# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "uv-python"

[setup]
script = '''
uv sync
uv run python -m unittest discover tests
'''

[cleanup]
script = '''
# Stop Python/uv processes whose command line references this worktree path
$wt = (Get-Location).Path
Get-CimInstance Win32_Process |
  Where-Object {
    ($_.Name -match '^(python|pythonw|uv)\.exe$') -and
    ($_.CommandLine -like "*$wt*")
  } |
  ForEach-Object {
    Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
  }

# Remove ephemeral caches in this worktree only
Remove-Item -Recurse -Force .pytest_cache -ErrorAction SilentlyContinue
Get-ChildItem -Recurse -Directory -Filter "__pycache__" -ErrorAction SilentlyContinue |
  Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
'''

[[actions]]
name = "Run Pen Bridge"
icon = "run"
command = "uv run python scripts/pressure_to_pen.py --hz 60 --curve linear --raw-min 80 --raw-max 185 --deadzone-low 0.00 --deadzone-high 1.00 --contact-source lmb_and_pressure --contact-threshold 12 --release-threshold 4 --suppress-lmb --no-click-through --release-teardown --duration 30 --log-file docs/pressure_pen_release_fix4.txt"

[[actions]]
name = "Visualize"
icon = "debug"
